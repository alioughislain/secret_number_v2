<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jeu du Nombre Mystère</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #ffd700;
      text-shadow: 2px 2px 5px #000;
    }
    .scoreboard {
      margin: 20px auto;
      padding: 15px;
      background: rgba(0,0,0,0.4);
      border-radius: 10px;
      width: 350px;
    }
    button {
      background: #ffd700;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      font-size: 1em;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #ffa500;
      transform: scale(1.05);
    }
    input {
      padding: 10px;
      font-size: 1em;
      margin-top: 15px;
      border-radius: 5px;
      border: none;
    }
    .result {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
    }
    #timer {
      font-size: 1.5em;
      margin-top: 15px;
      color: #00ffcc;
    }
  </style>
</head>
<body>
  <h1>🎮 Jeu du Nombre Mystère 🎮</h1>
  <div class="scoreboard">
    <p id="score">Score total : 0</p>
    <p id="highscore">🏆 High Score : 0</p>
    <p id="level">Niveau actuel : Débutant</p>
    <p id="timer">⏱ Temps : 0s</p>
  </div>

  <button onclick="startGame(1)">Débutant</button>
  <button onclick="startGame(2)">Intermédiaire</button>
  <button onclick="startGame(3)">Expert</button>
  <button onclick="startGame(4)">GOAT</button>
  <button onclick="quitGame()">Quitter</button>

  <div>
    <input type="number" id="guessInput" placeholder="Votre nombre..." />
    <button onclick="checkGuess()">Valider</button>
  </div>

  <div class="result" id="result"></div>

  <!-- Sons -->
  <audio id="winSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>
  <audio id="loseSound" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

  <script>
    let totalScore = 0;
    let highScore = 0;
    let timerInterval;
    let numberGenere, tentatives, tries, basePoints, startTime;

    function calculBonusTentatives(t) {
      if (t === 1) return 10;
      if (t === 2) return 5;
      if (t === 3) return 2;
      return 0;
    }

    function calculBonusTemps(s) {
      if (s <= 10) return 10;
      if (s <= 20) return 5;
      if (s <= 30) return 2;
      return 0;
    }

    function updateScoreboard() {
      let level;
      if (totalScore <= 20) level = "Débutant";
      else if (totalScore <= 50) level = "Intermédiaire";
      else if (totalScore <= 200) level = "Expert";
      else level = "God";

      document.getElementById("score").innerText = "Score total : " + totalScore;
      document.getElementById("highscore").innerText = "🏆 High Score : " + highScore;
      document.getElementById("level").innerText = "Niveau actuel : " + level;
    }

    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(() => {
        let elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById("timer").innerText = "⏱ Temps : " + elapsed + "s";
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function startGame(mode) {
      if (mode === 1) { numberGenere = Math.floor(Math.random() * 11); tries = 3; basePoints = 10; }
      if (mode === 2) { numberGenere = Math.floor(Math.random() * 101); tries = 5; basePoints = 20; }
      if (mode === 3) { numberGenere = Math.floor(Math.random() * 1001); tries = 7; basePoints = 50; }
      if (mode === 4) { numberGenere = Math.floor(Math.random() * 10001); tries = 20; basePoints = 100; }

      tentatives = 0;
      document.getElementById("result").innerText = "Nouvelle partie commencée ! Devinez le nombre...";
      startTimer();
    }

    function checkGuess() {
      let guess = parseInt(document.getElementById("guessInput").value);
      tentatives++;

      if (guess > numberGenere) {
        document.getElementById("result").innerText = "Trop grand !";
      } else if (guess < numberGenere) {
        document.getElementById("result").innerText = "Trop petit !";
      } else {
        let elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById("result").innerText = "Bravo 🎉 trouvé en " + elapsed + " secondes !";
        totalScore += basePoints + calculBonusTentatives(tentatives) + calculBonusTemps(elapsed);
        document.getElementById("winSound").play();
        stopTimer();
      }

      if (tentatives >= tries && guess !== numberGenere) {
        document.getElementById("result").innerText = "Dommage 😢 le nombre était " + numberGenere;
        document.getElementById("loseSound").play();
        stopTimer();
      }

      if (totalScore > highScore) {
        highScore = totalScore;
      }

      updateScoreboard();
    }

    function quitGame() {
      document.getElementById("result").innerText = "Merci d'avoir joué ! 👋";
      stopTimer();
    }

    updateScoreboard();
  </script>
</body>
</html>

<script>
const LEVELS = {
  1: { max: 10,   tries: 3,  base: 10,  label: 'Débutant',      ranks: [0,15,40] },
  2: { max: 100,  tries: 5,  base: 25,  label: 'Intermédiaire', ranks: [0,50,120] },
  3: { max: 1000, tries: 7,  base: 60,  label: 'Expert',        ranks: [0,150,400] },
  4: { max: 9999, tries: 10, base: 130, label: 'GOAT',          ranks: [0,400,900] }
};

const RANK_THRESHOLDS = [
  { min: 0,    label: '🌱 Débutant',    color: '#7a8099' },
  { min: 50,   label: '⚡ Chasseur',    color: '#3d8bef' },
  { min: 150,  label: '🔥 Vétéran',     color: '#e8a020' },
  { min: 400,  label: '💎 Élite',       color: '#8b5cf6' },
  { min: 900,  label: '💀 Légende',     color: '#ff4757' },
];

let state = {
  score: 0, highScore: 0, games: 0, wins: 0,
  active: false, level: null, secret: null,
  tries: 0, maxTries: 0, elapsed: 0,
  startTime: null, timerInterval: null,
  lo: 0, hi: 0, history: [], basePoints: 0
};

function getEl(id) { return document.getElementById(id); }

function getRank(score) {
  for (let i = RANK_THRESHOLDS.length - 1; i >= 0; i--) {
    if (score >= RANK_THRESHOLDS[i].min) return RANK_THRESHOLDS[i];
  }
  return RANK_THRESHOLDS[0];
}

function updateStats() {
  getEl('score-val').textContent = state.score;
  getEl('hs-val').textContent = state.highScore;
  getEl('games-val').textContent = state.games;
  getEl('wins-val').textContent = state.wins;
  const rank = getRank(state.score);
  const badge = getEl('rank-badge');
  badge.textContent = rank.label;
  badge.style.color = rank.color;
  badge.style.borderColor = rank.color + '55';
  badge.style.background = rank.color + '18';
}

function selectLevel(lvl) {
  if (state.active) return;
  state.level = lvl;
  document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
  getEl('lvl-' + lvl).classList.add('active');
  startGame();
}

function startGame() {
  if (!state.level) return;
  const cfg = LEVELS[state.level];
  state.secret = Math.floor(Math.random() * (cfg.max + 1));
  state.tries = 0;
  state.maxTries = cfg.tries;
  state.lo = 0;
  state.hi = cfg.max;
  state.history = [];
  state.elapsed = 0;
  state.basePoints = cfg.base;
  state.active = true;
  state.startTime = Date.now();

  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(tickTimer, 1000);

  getEl('idle-msg').style.display = 'none';
  getEl('active-ui').style.display = 'flex';
  getEl('history-wrap').style.display = 'none';
  getEl('history-wrap').innerHTML = '';
  getEl('guess-input').value = '';
  getEl('guess-input').disabled = false;
  getEl('btn-validate').disabled = false;
  getEl('btn-new').style.display = 'none';
  getEl('btn-abandon').style.display = 'inline-block';

  setFeedback('Entre un nombre entre ' + state.lo + ' et ' + state.hi, 'neutral');
  renderDots();
  updateRangeBar(null);
  updateTimerRing(0);
  getEl('guess-input').focus();
}

function tickTimer() {
  state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
  getEl('timer-text').textContent = state.elapsed + 's';
  updateTimerRing(state.elapsed);
}

function updateTimerRing(s) {
  const circ = 138;
  const maxSec = 60;
  const offset = Math.min(circ, (s / maxSec) * circ);
  getEl('timer-ring').style.strokeDashoffset = offset;
  const pct = s / maxSec;
  const col = pct < 0.5 ? '#00d4aa' : pct < 0.8 ? '#f5c842' : '#ff4757';
  getEl('timer-ring').style.stroke = col;
}

function renderDots() {
  const track = getEl('attempts-track');
  track.innerHTML = '';
  for (let i = 0; i < state.maxTries; i++) {
    const d = document.createElement('div');
    d.className = 'attempt-dot';
    if (i < state.tries) d.classList.add('used');
    else d.classList.add('remaining');
    track.appendChild(d);
  }
}

function updateRangeBar(guess) {
  const cfg = LEVELS[state.level];
  const max = cfg.max;
  const loPct = (state.lo / max) * 100;
  const hiPct = (state.hi / max) * 100;
  const fillPct = hiPct - loPct;
  getEl('range-fill').style.left = loPct + '%';
  getEl('range-fill').style.width = fillPct + '%';
  getEl('range-lo').textContent = state.lo;
  getEl('range-hi').textContent = state.hi;
  if (guess !== null) {
    const pos = (guess / max) * 100;
    getEl('range-indicator').style.left = Math.max(0, Math.min(100, pos)) + '%';
    getEl('range-mid').textContent = guess;
  } else {
    getEl('range-indicator').style.left = '50%';
    getEl('range-mid').textContent = '?';
  }
}

function setFeedback(msg, cls) {
  const el = getEl('feedback');
  el.textContent = msg;
  el.className = 'feedback-bar ' + cls;
}

function addHistory(guess, dir) {
  const wrap = getEl('history-wrap');
  wrap.style.display = 'block';
  const item = document.createElement('div');
  item.className = 'history-item';
  const numEl = document.createElement('span');
  numEl.className = 'hi-num ' + (dir === 'high' ? 'hi-high' : dir === 'low' ? 'hi-low' : '');
  numEl.textContent = guess;
  const dirEl = document.createElement('span');
  dirEl.className = 'hi-dir';
  dirEl.textContent = dir === 'high' ? '▲ Trop grand' : dir === 'low' ? '▼ Trop petit' : '';
  item.appendChild(numEl);
  item.appendChild(dirEl);
  wrap.prepend(item);
}

function showToast(msg, type) {
  const t = getEl('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function bonusTentatives(t) { return t === 1 ? 20 : t === 2 ? 10 : t === 3 ? 5 : 0; }
function bonusTemps(s) { return s <= 8 ? 20 : s <= 20 ? 10 : s <= 40 ? 5 : 0; }

function endGame(won) {
  clearInterval(state.timerInterval);
  state.active = false;
  state.games++;

  if (won) {
    state.wins++;
    const pts = state.basePoints + bonusTentatives(state.tries) + bonusTemps(state.elapsed);
    state.score += pts;
    if (state.score > state.highScore) state.highScore = state.score;
    const detail = '+' + pts + ' pts (base ' + state.basePoints + ' + tentatives ' + bonusTentatives(state.tries) + ' + temps ' + bonusTemps(state.elapsed) + ')';
    setFeedback('🎯 Trouvé en ' + state.tries + ' tentative' + (state.tries > 1 ? 's' : '') + ' · ' + state.elapsed + 's · ' + detail, 'win');
    showToast('🏆 +' + pts + ' points !', 'win-toast');
  } else {
    setFeedback('😢 Raté — le nombre mystère était ' + state.secret, 'lose');
    showToast('Game Over · C\'était ' + state.secret, 'lose-toast');
  }

  getEl('guess-input').disabled = true;
  getEl('btn-validate').disabled = true;
  getEl('btn-new').style.display = 'inline-block';
  getEl('btn-abandon').style.display = 'none';
  updateStats();
}

function checkGuess() {
  if (!state.active) return;
  const inp = getEl('guess-input');
  const val = inp.value.trim();
  if (val === '') return;
  const guess = parseInt(val, 10);
  const cfg = LEVELS[state.level];
  if (isNaN(guess) || guess < 0 || guess > cfg.max) {
    setFeedback('Entre un nombre valide entre 0 et ' + cfg.max, 'hint-high');
    return;
  }

  state.tries++;
  renderDots();
  inp.value = '';
  inp.focus();

  if (guess === state.secret) {
    updateRangeBar(guess);
    endGame(true);
    return;
  }

  if (guess > state.secret) {
    state.hi = Math.min(state.hi, guess - 1);
    setFeedback('▲ Trop grand ! La réponse est entre ' + state.lo + ' et ' + state.hi, 'hint-high');
    addHistory(guess, 'high');
  } else {
    state.lo = Math.max(state.lo, guess + 1);
    setFeedback('▼ Trop petit ! La réponse est entre ' + state.lo + ' et ' + state.hi, 'hint-low');
    addHistory(guess, 'low');
  }

  updateRangeBar(guess);

  if (state.tries >= state.maxTries) {
    endGame(false);
  }
}

function newGame() {
  if (state.active) return;
  startGame();
}

function abandonGame() {
  if (!state.active) return;
  clearInterval(state.timerInterval);
  state.active = false;
  state.games++;
  setFeedback('🏳️ Abandonné · C\'était ' + state.secret, 'lose');
  getEl('guess-input').disabled = true;
  getEl('btn-validate').disabled = true;
  getEl('btn-new').style.display = 'inline-block';
  getEl('btn-abandon').style.display = 'none';
  updateStats();
}

function resetStats() {
  if (state.active) return;
  state.score = 0; state.highScore = 0; state.games = 0; state.wins = 0;
  getEl('idle-msg').style.display = 'block';
  getEl('active-ui').style.display = 'none';
  getEl('btn-new').style.display = 'none';
  getEl('btn-abandon').style.display = 'none';
  document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
  state.level = null;
  updateStats();
}

document.getElementById('guess-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkGuess();
});

updateStats();
